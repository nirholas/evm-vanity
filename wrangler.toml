name = "evm-vanity"
main = "worker/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"

# Attestations are signed with this key. Set it once with:
#   npx wrangler secret put ATTESTATION_KEY
# Leave it unset and the Worker mints an ephemeral key per isolate, which is
# fine for a preview deployment and useless as a durable identity.
[vars]
ALLOW_SERVER_GRIND = "0"
